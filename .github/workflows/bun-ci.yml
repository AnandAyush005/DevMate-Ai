name: Bun Cli

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
    paths:
      -"backend/**"


jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
    
      - name: Install
        run: cd backend && bun install
      - name: Run tests
        run: cd backend && bun test